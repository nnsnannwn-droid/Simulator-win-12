const bar=u.querySelector('.upbar b'),n=u.querySelector('small span'),em=u.querySelector('small em'),D=isLong(T2)?8000+Math.floor(parseFloat(T2[0]))*5000:5000+parseFloat(T2[0])*1000,t0=performance.now(),st=t=>{const p=Math.min(100,(t-t0)/D*100);bar.style.width=p+'%';n.textContent=p|0;em.textContent=p<15?'Подготовка…':p<55?'Обновление прошивки…':p<85?'Настройка компонентов…':'Завершение…';if(p<100)requestAnimationFrame(st);else setTimeout(()=>{u.classList.add('out');setTimeout(()=>u.remove(),700);done&&done()},500)};requestAnimationFrame(st)}
const online=()=>!!S.wifi&&!S.air&&navigator.onLine!==false;
function dlStart(v){const tok=S.dlTok=(S.dlTok||0)+1,lng=isLong(v),total=lng?7500:3800,sizeMB=lng?Math.round(1300+Math.random()*900):Math.round(220+Math.random()*180);

$('#upc-v').textContent=d.v[0];$('#upc-f').textContent='Прошивка '+d.v[1];$('#upc-k').textContent=(d.glob?'Глобальное обновление':'Второстепенное обновление')+' · '+(d.lng?'долгая установка':'быстрая установка');
